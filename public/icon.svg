<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#05070c"/>
    </linearGradient>
    <linearGradient id="neon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="110" fill="url(#bg)" stroke="#06b6d4" stroke-width="8"/>

  <!-- Neon Ceiling Beam -->
  <rect x="40" y="70" width="432" height="12" rx="6" fill="#06b6d4" filter="url(#glow)"/>

  <!-- Neon Floor Beam -->
  <rect x="40" y="430" width="432" height="12" rx="6" fill="#06b6d4" filter="url(#glow)"/>

  <!-- Glowing Obstacles -->
  <polygon points="160,430 190,340 220,430" fill="#f43f5e" filter="url(#glow)"/>
  <polygon points="320,70 350,160 380,70" fill="#f43f5e" filter="url(#glow)"/>

  <!-- Gravity Arrows Trail -->
  <path d="M 230,220 L 256,180 L 282,220" stroke="#38bdf8" stroke-width="8" stroke-linecap="round" fill="none" opacity="0.6"/>
  <path d="M 230,300 L 256,340 L 282,300" stroke="#38bdf8" stroke-width="8" stroke-linecap="round" fill="none" opacity="0.6"/>

  <!-- Glowing Hero Sphere -->
  <circle cx="256" cy="260" r="48" fill="url(#neon)" filter="url(#glow)"/>
  <circle cx="270" cy="246" r="16" fill="#ffffff" opacity="0.9"/>
</svg>
